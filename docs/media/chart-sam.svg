<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-label="SAM 3 localisation hit rate at several cutoffs"><title>SAM 3 localisation hit rate at several cutoffs</title><rect width="960" height="428" rx="18" fill="#0b0f17"/><text x="40" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#f2f5fa" text-anchor="start">SAM 3 as a UI-element localiser: 14% vs a 60% bar set in advance</text><text x="40" y="80" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#8f9bb0" text-anchor="start">28 buggy screenshots; hit = predicted box overlaps the DOM element with IoU &gt;= 0.5. &#x27;score cutoff&#x27; = SAM confidence threshold.</text><text x="40" y="138" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="start">cutoff 0.5 (pre-registered)</text><rect x="330" y="118" width="440" height="28" rx="14" fill="#121826" stroke="#273245"/><rect x="330" y="118" width="62.857142857142854" height="28" rx="14" fill="#fbbf24" opacity="0.92"/><text x="786" y="138" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" font-weight="600" fill="#f2f5fa" text-anchor="start">4/28 = 14%</text><text x="40" y="190" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="600" fill="#8f9bb0" text-anchor="start">cutoff 0.3 (post hoc)</text><rect x="330" y="170" width="440" height="28" rx="14" fill="#121826" stroke="#273245"/><rect x="330" y="170" width="94.28571428571429" height="28" rx="14" fill="#6d7a93" opacity="0.92"/><text x="786" y="190" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" font-weight="600" fill="#f2f5fa" text-anchor="start">6/28 = 21%</text><text x="40" y="242" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="600" fill="#8f9bb0" text-anchor="start">cutoff 0.2 (post hoc)</text><rect x="330" y="222" width="440" height="28" rx="14" fill="#121826" stroke="#273245"/><rect x="330" y="222" width="157.14285714285714" height="28" rx="14" fill="#6d7a93" opacity="0.92"/><text x="786" y="242" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" font-weight="600" fill="#f2f5fa" text-anchor="start">10/28 = 36%</text><text x="40" y="294" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="600" fill="#8f9bb0" text-anchor="start">cutoff 0.1 (post hoc)</text><rect x="330" y="274" width="440" height="28" rx="14" fill="#121826" stroke="#273245"/><rect x="330" y="274" width="188.57142857142858" height="28" rx="14" fill="#6d7a93" opacity="0.92"/><text x="786" y="294" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" font-weight="600" fill="#f2f5fa" text-anchor="start">12/28 = 43%</text><text x="40" y="346" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="600" fill="#8f9bb0" text-anchor="start">cutoff 0.05 (post hoc)</text><rect x="330" y="326" width="440" height="28" rx="14" fill="#121826" stroke="#273245"/><rect x="330" y="326" width="188.57142857142858" height="28" rx="14" fill="#6d7a93" opacity="0.92"/><text x="786" y="346" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" font-weight="600" fill="#f2f5fa" text-anchor="start">12/28 = 43%</text><line x1="594.0" y1="104" x2="594.0" y2="368" stroke="#4ade80" stroke-width="3" stroke-dasharray="7 6"/><text x="594.0" y="98" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">60% bar</text><text x="40" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#8f9bb0" text-anchor="start">Result: SAM stays out of the agent. It returned no box at all for 23 of 28 screenshots at the pre-registered cutoff.</text></svg>