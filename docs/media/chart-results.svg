<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-label="Fix rates by configuration with confidence intervals"><title>Fix rates by configuration with confidence intervals</title><rect width="900" height="800" rx="18" fill="#0b0f17"/><text x="40" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#f2f5fa" text-anchor="start">Fix rate with 95% confidence intervals (whisker = interval)</text><text x="40" y="80" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#8f9bb0" text-anchor="start">Strict grading: hidden oracle + anti-cheat + no regression. Same grader for every row.</text><text x="40" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f2f5fa" text-anchor="start">Seeded bugs, held-out split</text><text x="40" y="144" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="400" fill="#8f9bb0" text-anchor="start">9 bugs x 3 runs per config</text><text x="40" y="190" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="17" font-weight="700" fill="#22d3ee" text-anchor="start">vision</text><rect x="150" y="170" width="340" height="28" rx="14" fill="#121826" stroke="#273245"/><rect x="150" y="170" width="302.6" height="28" rx="14" fill="#22d3ee" opacity="0.92"/><line x1="394.8" y1="184" x2="476.4" y2="184" stroke="#f2f5fa" stroke-width="3" opacity="0.9"/><line x1="394.8" y1="177" x2="394.8" y2="191" stroke="#f2f5fa" stroke-width="3"/><line x1="476.4" y1="177" x2="476.4" y2="191" stroke="#f2f5fa" stroke-width="3"/><text x="506" y="190" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="17" font-weight="600" fill="#f2f5fa" text-anchor="start">24/27 = 89%</text><text x="506" y="210" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-