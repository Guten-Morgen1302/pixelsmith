<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="Agent self-check versus grader"><title>Agent self-check versus grader</title><rect width="860" height="340" rx="18" fill="#0b0f17"/><text x="40" y="54" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="800" fill="#f2f5fa" text-anchor="start">28% of the agent&#x27;s &quot;fixed&quot; claims on real bugs were wrong</text><text x="40" y="82" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#8f9bb0" text-anchor="start">8 of 29 claims; checked against a hidden grader the model never sees</text><rect x="40" y="118" width="42" height="42" rx="9" fill="#fb7185"/><rect x="90" y="118" width="42" height="42" rx="9" fill="#fb7185"/><rect x="140" y="118" width="42" height="42" rx="9" fill="#fb7185"/><rect x="190" y="118" width="42" height="42" rx="9" fill="#fb7185"/><rect x="240" y="118" width="42" height="42" rx="9" fill="#fb7185"/><rect x="290" y="118" width="42" height="42" rx="9" fill="#fb7185"/><rect x="340" y="118" width="42" height="42" rx="9" fill="#fb7185"/><rect x="390" y="118" width="42" height="42" rx="9" fill="#fb7185"/><rect x="440" y="118" width="42" height="42" rx="9" fill="#4ade80"/><rect x="490" y="118" width="42" height="42" rx="9" fill="#4ade80"/><rect x="540" y="118" width="42" height="42" rx="9" fill="#4ade80"/><rect x="590" y="118" width="42" height="42" rx="9" fill="#4ade80"/><rect x="640" y="118" width="42" height="42" rx="9" fill="#4ade80"/><rect x="690" y="118" width="42" height="42" rx="9" fill="#4ade80"/><rect x="740" y="118" width="42" height="42" rx="9" fill="#4ade80"/><rect x="40" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="90" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="140" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="190" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="240" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="290" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="340" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="390" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="440" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="490" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="540" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="590" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="640" y="168" width="42" height="42" rx="9" fill="#4ade80"/><rect x="690" y="168" width="42" height="42" rx="9" fill="#4ade80"/><text x="40" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#8f9bb0" text-anchor="start">Seeded bugs (author-made): wrong claims</text><text x="40" y="272" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="700" fill="#4ade80" text-anchor="start">6 of 135 = 4%</text><text x="520" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#8f9bb0" text-anchor="start">Real bugs: wrong claims</text><text x="520" y="272" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="700" fill="#fb7185" text-anchor="start">8 of 29 = 28%</text><text x="40" y="310" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#8f9bb0" text-anchor="start">It also said &quot;not fixed&quot; when the grader passed it 6 times (the subtle spinner bug).</text></svg>